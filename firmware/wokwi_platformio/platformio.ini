[platformio]
default_envs = esp32dev, mean, persistence, tree, baseline

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_flags = -O2

[env:esp32dev]
build_flags = ${env.build_flags} -DBENCH_MODEL=0

[env:mean]
build_flags = ${env.build_flags} -DBENCH_MODEL=1

[env:persistence]
build_flags = ${env.build_flags} -DBENCH_MODEL=2

[env:tree]
build_flags = ${env.build_flags} -DBENCH_MODEL=3

[env:baseline]
build_flags = ${env.build_flags} -DBENCH_MODEL=4
